[fonts]
size = 16

[fonts.regular]
family = "MonofurZenMaruGothic"
style = "regular"

[fonts.bold]
family = "MonofurZenMaruGothic"
style = "bold"

[fonts.italic]
family = "MonofurZenMaruGothic"
style = "italic"

[fonts.bold-italic]
family = "MonofurZenMaruGothic"
style = "bold-italic"

[cursor]
shape = "block"
blinking = false

[section]
copy-on-select = true
confirm-before-quit = true

[editor]
theme = "atom"
program = "nvim"
args = []

[platform]
windows.shell = { program = "nu" }

[window]
opacity = 0.9

[renderer]
backend = "Webgpu"

[navigation]
mode = "Tab"
